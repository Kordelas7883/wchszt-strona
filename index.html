<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WCHSZT — przygoda się nie kończy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #050505;
      background-image: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.05) 0%, transparent 55%);
      color: #f4f4f5;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 860px;
      animation: fadeIn 1.4s ease-out forwards;
    }

    h1 {
      font-size: clamp(3.4rem, 12vw, 7.2rem);
      font-weight: 800;
      letter-spacing: 0.22em;
      padding-left: 0.22em;
      line-height: 1;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 20%, #8a8a93 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.5rem;
    }

    .divider {
      width: 56px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #52525b, transparent);
      margin-bottom: 1.5rem;
    }

    .tagline {
      font-size: clamp(1.05rem, 2.8vw, 1.45rem);
      font-weight: 200;
      letter-spacing: 0.16em;
      color: #a1a1aa;
      margin-bottom: 3.8rem;
    }

    .marquee-wrap {
      width: 100%;
      max-width: 620px;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to right, transparent, black 18%, black 82%, transparent);
      mask-image: linear-gradient(to right, transparent, black 18%, black 82%, transparent);
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: drift 32s linear infinite;
    }

    .marquee-track:hover {
      animation-play-state: paused;
    }

    .marquee-group {
      display: flex;
      align-items: center;
      gap: 2.2rem;
      padding-right: 2.2rem;
    }

    .spot {
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #71717a;
      white-space: nowrap;
      transition: color 0.4s ease;
    }

    .spot:hover {
      color: #e4e4e7;
    }

    .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background-color: #27272a;
      flex-shrink: 0;
    }

    footer {
      padding: 1.5rem;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: #27272a;
    }

    @keyframes drift {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <h1>WCHSZT</h1>
    <div class="divider"></div>
    <p class="tagline">przygoda się nie kończy</p>

    <div class="marquee-wrap" aria-label="Miejscówki">
      <div class="marquee-track">
        <div class="marquee-group">
          <span class="spot">cukrowa górka</span>
          <span class="dot"></span>
          <span class="spot">kleszczowa łąka</span>
          <span class="dot"></span>
          <span class="spot">droga Jarusiowa</span>
          <span class="dot"></span>
          <span class="spot">zbieg Gwiezdnych Wojen</span>
          <span class="dot"></span>
        </div>
        <div class="marquee-group" aria-hidden="true">
          <span class="spot">cukrowa górka</span>
          <span class="dot"></span>
          <span class="spot">kleszczowa łąka</span>
          <span class="dot"></span>
          <span class="spot">droga Jarusiowa</span>
          <span class="dot"></span>
          <span class="spot">zbieg Gwiezdnych Wojen</span>
          <span class="dot"></span>
        </div>
      </div>
    </div>
  </main>

  <footer>wchszt.pl</footer>
</body>
</html>
